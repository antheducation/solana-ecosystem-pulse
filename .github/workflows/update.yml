name: Update Solana Pulse

# The whole automation story: run the same `python run.py` a human would run,
# commit what changed, redeploy the dashboard. No secrets, no keys, no services.

on:
  schedule:
    - cron: "0 */6 * * *"   # every six hours - change this one line to change the cadence
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: solana-pulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm there is nothing to install
        run: |
          echo "Third-party packages required: none"
          python -c "import sys; print(sys.version)"
          pip list --format=freeze | head -20

      - name: Collect, analyse and render
        env:
          PULSE_RUN_BUDGET: "600"
        run: python run.py

      - name: Fail the run if any credential reached the outputs
        # Matches credential *values*, not the words. The outputs legitimately contain
        # the phrase "API keys" (this project advertises having none), so a bare
        # keyword grep would fail every run - it has to look for an assigned secret.
        run: |
          PATTERN='([Aa][Pp][Ii][_-]?[Kk][Ee][Yy]|[Tt][Oo][Kk][Ee][Nn]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd])["'\'']?[[:space:]]*[:=][[:space:]]*["'\'']?[A-Za-z0-9_\-]{16,}'
          PREFIXES='(gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|[Bb]earer[[:space:]]+[A-Za-z0-9._-]{20,})'
          if grep -rIEn "$PATTERN|$PREFIXES" data/latest.json docs/index.html REPORT.md ; then
            echo "::error::A credential-shaped value appeared in a generated output."
            exit 1
          fi
          echo "Clean: no credential-shaped values in any generated output."

      - name: Commit refreshed data, report and dashboard
        run: |
          git config user.name  "solana-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data REPORT.md docs
          if git diff --staged --quiet; then
            echo "No change this run."
          else
            git commit -m "chore(data): refresh Solana pulse $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi

      - name: Upload the dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
